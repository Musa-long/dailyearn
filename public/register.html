<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join — DailyEarn NG</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="brand" href="/">DailyEarn<span>NG</span></a></header><main class="auth"><div class="panel"><h1>Create your free account</h1><p>Start earning from daily tasks and referrals.</p><form id="f"><input name="name" placeholder="Full name" required><input name="email" type="email" placeholder="Email" required><input name="password" type="password" minlength="6" placeholder="Password (6+ characters)" required><input name="referral" placeholder="Referral code (optional)"><button>Join & Start Earning</button><div id="msg"></div></form><p>Already registered? <a href="/login.html">Login</a></p></div></main><script>f.onsubmit=async e=>{e.preventDefault();let r=await fetch("/api/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(f)))});let j=await r.json();if(j.ok)location="/dashboard.html";else msg.textContent=j.error}</script></body></html>
