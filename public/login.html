<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — DailyEarn NG</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="brand" href="/">DailyEarn<span>NG</span></a></header><main class="auth"><div class="panel"><h1>Welcome back</h1><p>Log in to continue your daily earning journey.</p><form id="f"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button>Login</button><div id="msg"></div></form><p>New here? <a href="/register.html">Create an account</a></p></div></main><script>f.onsubmit=async e=>{e.preventDefault();let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(f)))});let j=await r.json();if(j.ok)location="/dashboard.html";else msg.textContent=j.error}</script></body></html>
