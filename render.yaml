services:
  - type: web
    name: daily-earn-ng
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: daily-earn-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: REWARDED_AD_URL
        sync: false

databases:
  - name: daily-earn-db
    databaseName: daily_earn
    user: daily_earn_user
